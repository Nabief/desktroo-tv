# Construit et publie l'image sur ghcr.io à chaque tag vX.Y.Z, puis affiche l'empreinte à reporter dans le catalogue.
name: Publier l'image
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # essai de construction sans publier de version
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sur étiquette : les deux architectures et l'image définitive. À la main : un simple essai, en amd64.
      - id: cible
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=ghcr.io/nabief/desktroo-tv:${{ github.ref_name }},ghcr.io/nabief/desktroo-tv:latest" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/nabief/desktroo-tv:test" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.cible.outputs.platforms }}
          push: true
          tags: ${{ steps.cible.outputs.tags }}
      - name: Empreinte pour le catalogue
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "Version : \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Empreinte à mettre dans catalog.json : \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
