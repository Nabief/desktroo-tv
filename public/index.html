<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktroo TV</title>
<link rel="stylesheet" href="/a/_sdk/desktroo-app.css">

<style>
  .tv-step { max-width: 720px; }
  .tv-step h2 { margin-bottom: 6px; }
  .tv-lead { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; line-height: 1.5; }
  .tv-field { margin: 14px 0; }
  .tv-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .tv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .tv-msg { margin-top: 12px; font-size: 13px; line-height: 1.5; }
  .tv-msg.err { color: var(--danger); }
  .tv-msg.ok { color: var(--accent2); }
  .tv-sub { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; }
  .tv-sub b { font-weight: 600; }
  /* La liste défile : son bord doit se voir, sinon on croit qu'elle s'arrête là où elle est coupée. */
  .tv-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 14px; margin-top: 10px;
    max-height: min(52vh, 420px); overflow: auto; padding: 6px 8px; border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm); }
  .tv-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tv-chips button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--glass-border); background: transparent; color: var(--text-dim); }
  .tv-chips button:hover { color: var(--text); }
  .tv-chips button[aria-pressed="true"] { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .tv-groups::-webkit-scrollbar { width: 10px; }
  .tv-groups::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 6px; }
  .tv-groups label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; cursor: pointer; }
  .tv-groups .n { color: var(--text-dim); font-size: 11.5px; }
  .tv-checks { list-style: none; margin: 10px 0 0; padding: 0; }
  .tv-checks li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--glass-border); font-size: 13px; }
  .tv-checks li:last-child { border-bottom: 0; }
  .tv-checks .ic { width: 18px; flex-shrink: 0; }
  .tv-checks .d { color: var(--text-dim); font-size: 12px; }
  .tv-wait { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.25);
    border-top-color: var(--accent2); border-radius: 50%; animation: tvspin .8s linear infinite; vertical-align: -2px; }
  @keyframes tvspin { to { transform: rotate(360deg); } }
  .tv-note { margin-top: 18px; font-size: 12px; color: var(--text-dim); line-height: 1.5; }
  .tv-warn { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.6;
    border: 1px solid var(--warning, #c08a2e); background: color-mix(in srgb, var(--warning, #c08a2e) 10%, transparent); }
  .tv-warn .dk-btn { margin-top: 10px; }
  .tv-hint { margin: 0 0 6px; font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
  .tv-done { font-size: 15px; }
  .tv-log { margin-top: 16px; max-height: 320px; overflow: auto; padding: 12px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border); background: var(--surface-2); font: 11.5px/1.6 var(--font-mono); white-space: pre-wrap; }
  /* Attente des étapes longues : voile, anneau et explication. */
  .tv-veil { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20;
    background: rgba(5, 9, 16, .62); backdrop-filter: blur(2px); }
  .tv-veil.on { display: flex; }
  [data-theme="light"] .tv-veil { background: rgba(230, 236, 246, .72); }
  .tv-veil .box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 30px;
    border-radius: var(--radius); background: var(--surface); border: 1px solid var(--glass-border); max-width: 380px; text-align: center; }
  .tv-ring { width: 34px; height: 34px; border: 3px solid rgba(var(--accent-rgb), .22); border-top-color: var(--accent);
    border-radius: 50%; animation: tvspin .9s linear infinite; }
  .tv-veil .t { font-weight: 600; }
  .tv-veil .s { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .tv-bar { width: 220px; height: 6px; border-radius: 999px; background: rgba(var(--accent-rgb), .18); overflow: hidden; }
  .tv-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent);
    transition: width .35s ease; }
  /* Marque du fournisseur : carré orange, « FLUX » puis « TV ». */
  .tv-flux { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; letter-spacing: .5px; }
  .tv-flux svg { width: 17px; height: 17px; flex-shrink: 0; }
  .tv-flux .tv { color: #f59e0b; }
</style>
</head>
<body>
<div class="tv-veil" id="veil" role="status" aria-live="polite">
  <div class="box"><div class="tv-ring"></div><div class="t" id="veilT">Patientez…</div>
    <div class="tv-bar" id="veilB" hidden><i id="veilBi"></i></div>
    <div class="s" id="veilS"></div></div>
</div>
<div class="dk-shell">
  <nav class="dk-side" id="nav">
    <div class="dk-side-title">Installation</div>
    <button class="dk-nav active" data-step="1"><span class="dk-nav-ic">①</span><span class="dk-nav-name">Abonnement</span></button>
    <button class="dk-nav" data-step="2"><span class="dk-nav-ic">②</span><span class="dk-nav-name">Chaînes</span></button>
    <button class="dk-nav" data-step="3"><span class="dk-nav-ic">③</span><span class="dk-nav-name">Guide TV</span></button>
    <button class="dk-nav" data-step="4"><span class="dk-nav-ic">④</span><span class="dk-nav-name">Jellyfin</span></button>
    <div class="dk-side-sep"></div>
    <button class="dk-nav" data-step="check"><span class="dk-nav-ic">✓</span><span class="dk-nav-name">Vérification</span></button>
    <button class="dk-nav" data-step="apps"><span class="dk-nav-ic">📺</span><span class="dk-nav-name">Applis TV</span></button>
    <button class="dk-nav" data-step="engine"><span class="dk-nav-ic">⚙</span><span class="dk-nav-name">Réglages avancés</span></button>
    <div class="dk-side-fill"></div>
    <div class="dk-side-note" id="engineState">Moteur…</div>
  </nav>
  <section class="dk-main">
    <header class="dk-head">
      <div class="dk-head-text">
        <h1 class="dk-title" id="title">Abonnement</h1>
        <div class="dk-sub" id="sub">La liste de chaînes de votre fournisseur.</div>
      </div>
      <div class="dk-head-actions"><button class="dk-btn" id="refresh">Actualiser</button></div>
    </header>
    <div class="dk-body" id="body"></div>
  </section>
</div>

<script>
'use strict';
var S = {};            // dernier état connu du serveur
var groups = [];       // groupes de la liste de lecture
var step = '1';

/** Marque du fournisseur, écrite avec la police de l'app. */
function flux() {
  var n = String(S.siteName || 'FluxTV');
  var m = /^(.*?)(TV)$/i.exec(n);
  var mark = '<svg viewBox="0 0 64 64" aria-hidden="true">' +
    '<defs><linearGradient id="fxb" x1="0" y1="1" x2="1" y2="0">' +
    '<stop offset="0" stop-color="#f1760b"/><stop offset="1" stop-color="#ffc062"/></linearGradient></defs>' +
    '<circle cx="27" cy="32" r="22" fill="none" stroke="url(#fxb)" stroke-width="7"/>' +
    '<path d="M23 22 39 32 23 42Z" fill="url(#fxb)"/>' +
    '<path d="M47 17a21 21 0 0 1 0 30" fill="none" stroke="url(#fxb)" stroke-width="7" stroke-linecap="round" opacity=".55"/></svg>';
  return '<span class="tv-flux">' + mark + esc(m ? m[1].toUpperCase() : n.toUpperCase()) +
    (m ? '<span class="tv">' + esc(m[2].toUpperCase()) + '</span>' : '') + '</span>';
}

function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function date(ms) { return ms ? new Date(ms).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; }

async function api(path, body) {
  var opt = { cache: 'no-store', credentials: 'same-origin' };
  if (body !== undefined) {
    opt.method = 'POST';
    opt.headers = { 'Content-Type': 'application/json' };
    opt.body = JSON.stringify(body);
  }
  var r = await fetch(path, opt);
  var data = null;
  try { data = await r.json(); } catch (_) { data = null; }
  if (!r.ok) throw new Error((data && data.error) || ('Erreur ' + r.status));
  return data || {};
}

/** Voile d'attente : [title] ce qui se passe, [sub] pourquoi c'est long. */
function wait(on, title, sub) {
  var v = document.getElementById('veil');
  if (on) {
    document.getElementById('veilT').textContent = title || 'Patientez…';
    document.getElementById('veilS').textContent = sub || '';
    document.getElementById('veilB').hidden = true;
  }
  v.classList.toggle('on', !!on);
  if (!on) suivre(false);
}

/**
 * Suit l'avancement du travail en cours. Le moteur reconstruit tout après chaque groupe posé :
 * sans ce compte rendu, plusieurs minutes d'attente passent pour un plantage.
 */
var suivi = null;
function suivre(on) {
  if (suivi) { clearInterval(suivi); suivi = null; }
  if (!on) return;
  var bar = document.getElementById('veilB'), fill = document.getElementById('veilBi');
  suivi = setInterval(async function () {
    try {
      var j = await api('api/progress');
      if (!j || !j.total) return;
      bar.hidden = false;
      fill.style.width = Math.round((j.done / j.total) * 100) + '%';
      document.getElementById('veilT').textContent = j.label + '…';
      document.getElementById('veilS').textContent = (j.unit || 'Étape') + ' ' + Math.min(j.done + 1, j.total) +
        ' sur ' + j.total + '. Le moteur refait sa liste de chaînes à chaque fois, c\'est ce qui prend du temps.';
    } catch (e) { /* une mesure manquée n'a pas d'importance */ }
  }, 900);
}

function busy(btn, on, label) {
  if (!btn) return;
  btn.disabled = !!on;
  btn.innerHTML = on ? '<span class="tv-wait"></span> ' + esc(label || 'Patientez…') : btn.dataset.label;
}
function say(where, text, kind) {
  var n = document.getElementById(where);
  if (n) { n.className = 'tv-msg ' + (kind || ''); n.innerHTML = text; }
}

// ---------------------------------------------------------------- Écrans

function stepSubscription() {
  return `
  <div class="tv-step">
    <h2>Votre abonnement</h2>
    <p class="tv-lead">Collez l'adresse de la liste de chaînes que votre fournisseur (${S.siteName}, par exemple) vous a donnée.
      Elle ressemble à <code>http://serveur/get.php?username=…&amp;password=…</code>. Elle ne sort pas de votre NAS.</p>
    <div class="tv-field">
      <label for="url">Adresse de la liste de lecture</label>
      <input class="dk-input" id="url" placeholder="${S.subscriptionUrl ? 'Adresse enregistrée : laissez vide pour la garder' : 'http://…/get.php?username=…&amp;password=…'}" value="">
    </div>
    <div class="tv-row">
      <button class="dk-btn primary" id="go" data-label="Vérifier et continuer">Vérifier et continuer</button>
      <a class="dk-btn" href="https://${S.site}" target="_blank" rel="noopener">Pas d'abonnement ? ${flux()}</a>
    </div>
    <div class="tv-msg" id="m"></div>
    <p class="tv-note">${S.subscriptionUrl ? 'Adresse enregistrée : ' + esc(S.subscriptionUrl) +
      '. Laissez le champ vide pour la garder, ou collez-en une autre.' : 'Aucune adresse enregistrée pour le moment.'}
      ${S.subscriptionUrl ? '<br>Vous changez de fournisseur ? ' +
        '<button class="dk-btn" id="wipe" data-label="Effacer la liste et les chaînes">Effacer la liste et les chaînes</button>' : ''}</p>
  </div>`;
}

// Les fournisseurs rangent ces chaînes sous « XX | FOR ADULT », « ADULTS », « XXX »… Elles sont
// tenues à l'écart du reste : jamais dans les raccourcis, jamais cochées d'office, jamais prises
// par « Tout cocher » tant qu'elles ne sont pas montrées.
var ADULTE = /(^|[^a-z0-9])(xx+|adult[es]?|adulte?s?|porn\w*|erotic\w*|[ée]rotique?s?|18\+|\+18)([^a-z0-9]|$)/i;
function estAdulte(nom) { return ADULTE.test(String(nom)); }

/**
 * Pays et familles présents dans la liste. Les fournisseurs nomment leurs groupes « EU | FRANCE
 * CINEMA », « EU | SPAIN DAZN » : le mot qui suit la barre verticale sert de raccourci, sans qu'il
 * faille connaître d'avance les pays proposés.
 */
function families() {
  var count = {};
  groups.filter(function (g) { return !estAdulte(g.name); }).forEach(function (g) {
    var m = /(?:^|\|)\s*([^|]+)$/.exec(g.name);
    var w = (m ? m[1] : g.name).trim().split(/\s+/)[0];
    if (w && w.length > 1) count[w] = (count[w] || 0) + 1;
  });
  return Object.keys(count).filter(function (w) { return count[w] > 1; })
    .sort(function (a, b) { return count[b] - count[a] || a.localeCompare(b); })
    .slice(0, 12).map(function (w) { return { word: w, n: count[w] }; });
}

function stepChannels() {
  // Déjà installé : on recoche le choix en place, pour qu'ajouter un groupe soit un seul clic.
  // Première fois : on propose les groupes français, que l'on décoche au besoin.
  var deja = (S.chosen || []);
  var ligne = function (g) {
    var pre = deja.length ? deja.indexOf(g.name) !== -1 : /fr|franc/i.test(g.name) && !estAdulte(g.name);
    return '<label><input type="checkbox" value="' + esc(g.name) + '"' + (pre ? ' checked' : '') + '> ' +
      '<span>' + esc(g.name) + '</span><span class="n">' + g.count + '</span></label>';
  };
  var adultes = groups.filter(function (g) { return estAdulte(g.name); });
  var normaux = groups.filter(function (g) { return !estAdulte(g.name); });
  var adulteChoisi = adultes.some(function (g) { return deja.indexOf(g.name) !== -1; });
  var list = groups.length ? normaux.map(ligne).join('')
    // Les groupes ne vivent qu'en mémoire du moteur : après une réouverture, on les redemande.
    : (S.playlist
      ? '<p class="dk-muted">Les groupes se relisent dans votre liste de lecture.</p>'
      : '<p class="dk-muted">Commencez par l\'écran ① : l\'adresse de votre liste de chaînes.</p>');
  return `
  <div class="tv-step">
    <h2>Les chaînes à garder</h2>
    <p class="tv-lead">Votre liste contient souvent des dizaines de milliers de flux. Choisissez les groupes qui vous intéressent :
      les autres n'apparaîtront pas dans Jellyfin, qui restera rapide.</p>
    ${groups.length ? `<div class="tv-row" style="margin-bottom:0">
      <input class="dk-input" id="gq" placeholder="Filtrer : musique, sport, cinéma…" style="max-width:300px">
      <span class="dk-muted" id="gn">${normaux.length} groupes — la liste défile</span>
    </div>
    <div class="tv-chips" id="fam">${families().map(function (f) {
      return '<button type="button" data-w="' + esc(f.word) + '" aria-pressed="false">' + esc(f.word) +
        ' <span class="dk-muted">' + f.n + '</span></button>';
    }).join('')}</div>` : ''}
    <div class="tv-groups" id="groups">${list}</div>
    ${adultes.length ? `<div class="tv-field" style="margin-top:12px">
      <label><input type="checkbox" id="showadult"${adulteChoisi ? ' checked' : ''}>
        Afficher les ${adultes.length} groupe(s) pour adultes (${adultes.reduce(function (n, g) { return n + g.count; }, 0)} chaînes)</label>
      <div class="tv-groups" id="adult" style="margin-top:8px;display:${adulteChoisi ? '' : 'none'}">${adultes.map(ligne).join('')}</div>
    </div>` : ''}
    <div class="tv-field" style="margin-top:14px">
      <label><input type="checkbox" id="hdOnly"${S.hdOnly ? ' checked' : ''}> Garder seulement la version HD de chaque chaîne (sinon : HD, SD, HEVC et 4K, au choix dans l'appli)</label>
    </div>
    <div class="tv-row">
      ${groups.length ? '<button class="dk-btn" id="all" data-label="Tout cocher">Tout cocher</button>' +
        '<button class="dk-btn" id="none" data-label="Tout décocher">Tout décocher</button>' +
        '<button class="dk-btn primary" id="go" data-label="Garder ces chaînes">Garder ces chaînes</button>'
        : (S.playlist ? '<button class="dk-btn primary" id="reload" data-label="Relire la liste">Relire la liste</button>'
          : '<button class="dk-btn primary" id="back" data-label="Aller à l\'écran ①">Aller à l\'écran ①</button>')}
    </div>
    <div class="tv-msg" id="m"></div>
  </div>`;
}

function stepGuide() {
  return `
  <div class="tv-step">
    <h2>Le guide des programmes</h2>
    <p class="tv-lead">Desktroo utilise un guide français gratuit, mis à jour chaque nuit, et l'associe tout seul à vos chaînes.
      Les chaînes sans programme restent visibles.</p>
    <p class="tv-lead">Vous pouvez installer <b>les deux</b> : cliquez l'un puis l'autre. Chaque chaîne prend alors le premier
      guide qui la connaît, le dernier installé étant prioritaire — de quoi couvrir les chaînes qu'un seul des deux ignore.</p>
    <div class="tv-row">
      <button class="dk-btn primary" id="go" data-label="Installer le guide">Installer le guide</button>
      <button class="dk-btn" id="own" data-label="Utiliser celui du fournisseur">Utiliser celui du fournisseur</button>
    </div>
    <div class="tv-msg" id="m"></div>
    <p class="tv-note">Guides en place : ${(S.guides || []).map(function (g) { return esc(g.name) + ' (' + g.programs + ' programmes)'; }).join(' · ') || 'aucun'}
      ${(S.guides || []).length ? '<br><button class="dk-btn" id="wipeguide" data-label="Enlever le guide">Enlever le guide</button>' : ''}</p>
  </div>`;
}

function stepJellyfin() {
  return `
  <div class="tv-step">
    <h2>Relier Jellyfin</h2>
    <p class="tv-lead">Desktroo déclare le tuner et le guide dans Jellyfin à votre place. Donnez-lui un compte administrateur
      de votre Jellyfin : il crée une clé d'accès et n'enregistre pas votre mot de passe.</p>
    <div class="tv-field">
      <label for="jurl">Adresse de Jellyfin</label>
      <p class="tv-hint">Telle que l'app la joint depuis le NAS : le nom du conteneur si Jellyfin est une app Desktroo
        (<code>http://dt-jellyfin:8080</code> — les apps de Desktroo servent sur 8080, pas sur le port publié),
        sinon l'adresse locale du NAS (<code>http://192.168.0.10:8096</code>). Pas le domaine public.</p>
      <input class="dk-input" id="jurl" value="${esc(S.jellyfin.url || 'http://dt-jellyfin:8080')}">
    </div>
    <div class="tv-field">
      <label for="juser">Compte administrateur de Jellyfin</label>
      <input class="dk-input" id="juser" autocomplete="off">
    </div>
    <div class="tv-field">
      <label for="jpass">Son mot de passe</label>
      <input class="dk-input" id="jpass" type="password" autocomplete="off">
    </div>
    <div class="tv-row"><button class="dk-btn primary" id="go" data-label="Relier et terminer">Relier et terminer</button></div>
    <div class="tv-msg" id="m">${S.jellyfin.linked ? 'Déjà relié à ' + esc(S.jellyfin.url) + '.' : ''}</div>
    <p class="tv-note">Tuner déclaré : <code>${esc(S.tunerUrl)}</code><br>Guide déclaré : <code>${esc(S.guideUrl)}</code></p>
  </div>`;
}

function stepApps() {
  return `
  <div class="tv-step">
    <h2>Regarder la TV</h2>
    <p class="tv-lead">Vos chaînes sont dans Jellyfin : tous ses lecteurs les voient. Pour une vraie expérience de TV
      (zapping, guide en grille, favoris), installez TIVImu.</p>
    <ul class="dk-list dk-group">
      <li><span>📱</span><div><b>Téléphone et tablette</b><div class="dk-muted">Installez l'APK depuis la page des versions, puis connectez-vous à Jellyfin.</div></div></li>
      <li><span>📺</span><div><b>Fire TV et Android TV</b><div class="dk-muted">Application « Downloader », puis l'adresse de la dernière version.</div></div></li>
      <li><span>🖥️</span><div><b>Navigateur</b><div class="dk-muted">Jellyfin → TV en direct, sans rien installer.</div></div></li>
    </ul>
    <div class="tv-row"><a class="dk-btn primary" href="https://github.com/Nabief/TIVImu-releases/releases/latest" target="_blank" rel="noopener">Télécharger TIVImu</a></div>
  </div>`;
}

/**
 * Un serveur venant d'une installation à la main garde son ancien tuner : ses chaînes s'ajoutent aux
 * nôtres et tout apparaît en double. On le dit, et on propose de l'enlever.
 */
function othersHtml(o) {
  var l = ((o && o.tuners) || []).concat((o && o.guides) || []);
  if (!l.length) return '';
  return '<div class="tv-warn" id="others">Jellyfin reçoit déjà la TV en direct d\'ailleurs : <b>' +
    l.map(function (x) { return esc(x.label); }).join('</b>, <b>') + '</b>.<br>' +
    'Tant que cette source reste déclarée, chaque chaîne apparaît deux fois dans Jellyfin.' +
    '<br><button class="dk-btn" id="drop" data-label="Enlever l\'ancienne source">Enlever l\'ancienne source</button></div>';
}

function bindOthers() {
  var btn = document.getElementById('drop');
  if (!btn) return;
  btn.dataset.label = btn.textContent;
  btn.onclick = async function () {
    busy(btn, true, 'Retrait…');
    try {
      var r = await api('api/jellyfin/others', { remove: true });
      var box = document.getElementById('others');
      box.innerHTML = r.removed
        ? 'Ancienne source retirée.' + (r.refreshing ? ' Jellyfin actualise son guide ; le compte de chaînes retombera dans quelques minutes.' : '')
        : 'Rien à retirer.';
      await load();
    } catch (e) { say('m', esc(e.message), 'err'); busy(btn, false); }
  };
}

function stepCheck() {
  return `
  <div class="tv-step">
    <h2>Vérification</h2>
    <p class="tv-lead">Contrôle de bout en bout : abonnement, liste, chaînes, guide et Jellyfin.</p>
    <div class="tv-row">
      <button class="dk-btn primary" id="go" data-label="Vérifier mon installation">Vérifier mon installation</button>
      <button class="dk-btn" id="log" data-label="Voir le journal du moteur">Voir le journal du moteur</button>
      <button class="dk-btn" id="unlock" data-label="Débloquer la lecture">Débloquer la lecture</button>
      <button class="dk-btn" id="repair" data-label="Remettre Jellyfin d'aplomb">Remettre Jellyfin d'aplomb</button>
    </div>
    <ul class="tv-checks" id="checks"></ul>
    <pre class="tv-log" id="logbox" hidden></pre>
    <div class="tv-msg" id="m"></div>
  </div>`;
}

function stepEngine() {
  // L'interface du moteur est conçue pour une fenêtre entière : à l'étroit dans un cadre, elle est
  // illisible. On l'ouvre donc à côté, en passant par Desktroo, qui lui ouvre l'accès.
  return `
  <div class="tv-step">
    <p class="tv-lead">Réglages fins du moteur Threadfin : filtres, association chaîne par chaîne, journal.
      L'assistant suffit dans la plupart des cas — n'y touchez que si vous savez ce que vous cherchez.</p>
    <div class="tv-row">
      <a class="dk-btn primary" href="engine/web/" target="_blank" rel="noopener">Ouvrir les réglages du moteur</a>
      <button class="dk-btn" id="log" data-label="Voir le journal">Voir le journal</button>
    </div>
    <p class="tv-note">S'ouvre dans un autre onglet, en pleine largeur. Le moteur n'est pas accessible depuis
      votre réseau : il ne répond qu'à travers Desktroo, à vous seul.</p>
    <pre class="tv-log" id="logbox" hidden></pre>
    <div class="tv-msg" id="m"></div>
  </div>`;
}

var STEPS = {
  '1': { title: 'Abonnement', sub: 'La liste de chaînes de votre fournisseur.', html: stepSubscription },
  '2': { title: 'Chaînes', sub: 'Les groupes que vous voulez voir.', html: stepChannels },
  '3': { title: 'Guide TV', sub: 'Les programmes, associés automatiquement.', html: stepGuide },
  '4': { title: 'Jellyfin', sub: 'Le tuner et le guide déclarés à votre place.', html: stepJellyfin },
  check: { title: 'Vérification', sub: 'Tout fonctionne-t-il ?', html: stepCheck },
  apps: { title: 'Applis TV', sub: 'Regarder sur la télé, le téléphone ou le navigateur.', html: stepApps },
  engine: { title: 'Réglages avancés', sub: 'Le moteur, pour les cas particuliers.', html: stepEngine },
};

// ---------------------------------------------------------------- Actions

function wire() {
  var go = document.getElementById('go');
  if (go) go.dataset.label = go.textContent;

  if (step === '1') {
    var url = document.getElementById('url');
    go.onclick = async function () {
      busy(go, true, 'Vérification…');
      wait(true, 'Vérification de votre abonnement…', 'On demande son état à votre fournisseur.');
      try {
        var sub = await api('api/subscription', { url: url.value });
        var line = '<div class="tv-sub"><span><b>' + esc(sub.status) + '</b></span>' +
          (sub.expiresAt ? '<span>jusqu\'au <b>' + date(sub.expiresAt) + '</b></span>' : '') +
          '<span>' + sub.connections + ' / ' + sub.maxConnections + ' connexion(s)</span>' +
          (sub.trial ? '<span>essai</span>' : '') + '</div>';
        say('m', line + '<p>Chargement de la liste…</p>', sub.active ? 'ok' : 'err');
        busy(go, true, 'Chargement de la liste…');
        wait(true, 'Lecture de votre liste de chaînes…',
          'La liste est téléchargée, puis débarrassée des films et des séries pour ne garder que la TV en direct. ' +
          'Comptez une à deux minutes sur une grosse liste ; laissez cette fenêtre ouverte.');
        var res = await api('api/playlist', { url: url.value, tuner: sub.maxConnections });
        groups = res.groups || [];
        say('m', line + '<p class="ok">' + res.live + ' chaînes en direct' +
          (res.vod ? ' (' + res.vod + ' films et séries écartés)' : '') + ', ' + groups.length +
          ' groupes. Passez aux chaînes.</p>', 'ok');
        show('2');
      } catch (e) {
        say('m', esc(e.message) + '<br><span class="dk-muted">Le journal du moteur, à l\'écran Vérification, ' +
          'dit ce qui s\'est passé.</span>', 'err');
      }
      wait(false);
      busy(go, false);
    };
  }

  var wipe = document.getElementById('wipe');
  if (wipe) {
    wipe.dataset.label = wipe.textContent;
    wipe.onclick = async function () {
      if (!confirm("Effacer la liste de lecture, les groupes choisis et les chaînes ?\n\n" +
        "Le guide, la liaison avec Jellyfin et vos réglages restent en place. " +
        "Vous repartirez de l'adresse de votre nouveau fournisseur.")) return;
      busy(wipe, true, 'Effacement…');
      try {
        await api('api/reset', { what: 'playlist' });
        await load();
        show('1');
        say('m', 'Effacé. Collez l\'adresse de votre nouveau fournisseur ci-dessus.', 'ok');
      } catch (e) { say('m', esc(e.message), 'err'); busy(wipe, false); }
    };
  }

  var wipeGuide = document.getElementById('wipeguide');
  if (wipeGuide) {
    wipeGuide.dataset.label = wipeGuide.textContent;
    wipeGuide.onclick = async function () {
      if (!confirm("Enlever le guide des programmes ?\n\nVos chaînes restent visibles dans Jellyfin, " +
        "mais sans programmes tant qu'un autre guide n'est pas installé.")) return;
      busy(wipeGuide, true, 'Retrait…');
      try {
        await api('api/reset', { what: 'guide' });
        await load();
        show('3');
        say('m', 'Guide retiré. Vos chaînes restent visibles, sans programmes.', 'ok');
      } catch (e) { say('m', esc(e.message), 'err'); busy(wipeGuide, false); }
    };
  }

  if (step === '2') {
    var back = document.getElementById('back');
    if (back) { back.onclick = function () { show('1'); }; return; }
    var reload = document.getElementById('reload');
    if (reload) {
      reload.dataset.label = reload.textContent;
      reload.onclick = async function () {
        busy(reload, true, 'Lecture de la liste…');
        wait(true, 'Lecture de votre liste de chaînes…', 'Téléchargement puis tri : une à deux minutes sur une grosse liste.');
        try {
          var r = await api('api/playlist', {});
          groups = r.groups || [];
          say('m', r.live + ' chaînes en direct' + (r.vod ? ' (' + r.vod + ' films et séries écartés)' : '') +
            ', ' + groups.length + ' groupes.', 'ok');
          show('2');
        } catch (e) { say('m', esc(e.message), 'err'); busy(reload, false); }
        wait(false);
      };
      return;
    }
    var boxes = function () { return Array.prototype.slice.call(document.querySelectorAll('#groups input, #adult input')); };
    var sa = document.getElementById('showadult');
    if (sa) {
      sa.onchange = function () {
        var box = document.getElementById('adult');
        box.style.display = sa.checked ? '' : 'none';
        if (!sa.checked) {
          // Masquer, c'est renoncer : sinon un groupe coché resterait choisi sans être visible.
          Array.prototype.forEach.call(box.querySelectorAll('input'), function (b) { b.checked = false; });
        }
      };
    }
    // « Tout cocher » ne porte que sur ce qui est affiché : avec un filtre en cours, cocher
    // soixante groupes invisibles serait une mauvaise surprise.
    var shown = function () { return boxes().filter(function (b) { return b.offsetParent !== null; }); };
    document.getElementById('all').onclick = function () { shown().forEach(function (b) { b.checked = true; }); };
    document.getElementById('none').onclick = function () { shown().forEach(function (b) { b.checked = false; }); };
    var fam = document.getElementById('fam');
    if (fam) {
      fam.onclick = function (e) {
        var b = e.target.closest('button[data-w]');
        if (!b) return;
        var on = b.getAttribute('aria-pressed') === 'true';
        Array.prototype.forEach.call(fam.children, function (x) { x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', on ? 'false' : 'true');
        var q = document.getElementById('gq');
        q.value = on ? '' : b.dataset.w;
        q.dispatchEvent(new Event('input'));
      };
    }
    var gq = document.getElementById('gq');
    if (gq) {
      gq.oninput = function () {
        var q = gq.value.trim().toLowerCase();
        var n = 0;
        boxes().forEach(function (b) {
          var ok = !q || b.parentNode.textContent.toLowerCase().indexOf(q) !== -1;
          b.parentNode.style.display = ok ? '' : 'none';
          if (ok) n++;
        });
        var total = document.querySelectorAll('#groups input').length;
        document.getElementById('gn').textContent = q ? n + ' groupe(s) sur ' + total
          : total + ' groupes — la liste défile';
      };
    }
    go.onclick = async function () {
      var chosen = boxes().filter(function (b) { return b.checked; }).map(function (b) { return b.value; });
      busy(go, true, 'Mise en place…');
      wait(true, 'Mise en place de vos chaînes…',
        'Comptez une à plusieurs minutes selon le nombre de groupes : ce n\'est pas bloqué.');
      suivre(true);
      try {
        var r = await api('api/filters', { groups: chosen, hdOnly: document.getElementById('hdOnly').checked,
          exclude: (document.getElementById('exc') || {}).value });
        say('m', r.channels + ' chaîne(s) retenue(s). Passez au guide.', 'ok');
        await load();
        show('3');
      } catch (e) { say('m', esc(e.message), 'err'); }
      wait(false);
      busy(go, false);
    };
  }

  if (step === '3') {
    var run = async function (btn, payload) {
      busy(btn, true, 'Installation du guide…');
      wait(true, 'Installation du guide…', 'Téléchargement des programmes puis association à vos chaînes.');
      try {
        var r = await api('api/guide', payload);
        var detail = (r.sources || []).filter(function (x) { return x.matched; })
          .map(function (x) { return esc(x.name) + ' : ' + x.matched; }).join(' · ');
        say('m', r.matched + ' chaîne(s) avec programmes, ' + r.dummy + ' sans (elles restent visibles).' +
          ((r.sources || []).length > 1 ? '<br><span class="dk-muted">' + detail + '</span>' : '') +
          ' Passez à Jellyfin.', 'ok');
        await load();
        show('4');
      } catch (e) { say('m', esc(e.message), 'err'); }
      wait(false);
      busy(btn, false);
    };
    go.onclick = function () { run(go, {}); };
    var own = document.getElementById('own');
    own.dataset.label = own.textContent;
    own.onclick = function () {
      var u = prompt("Adresse du guide de votre fournisseur (xmltv.php…)");
      if (u) run(own, { url: u });
    };
  }

  if (step === '4') {
    go.onclick = async function () {
      busy(go, true, 'Liaison…');
      wait(true, 'Liaison avec Jellyfin…', 'Déclaration du tuner et du guide, puis lancement de l\'actualisation.');
      try {
        var r = await api('api/jellyfin', {
          url: document.getElementById('jurl').value,
          user: document.getElementById('juser').value,
          password: document.getElementById('jpass').value,
        });
        document.getElementById('jpass').value = '';
        say('m', '<span class="tv-done">Terminé : ' + esc(r.server) + ' reçoit vos chaînes.' +
          (r.refreshing ? ' Le guide se remplit, cela prend quelques minutes.' : '') + '</span>' + othersHtml(r.others), 'ok');
        bindOthers();
        if (window.desktroo) desktroo.notify('TV en direct installée', 'success');
        await load();
      } catch (e) { say('m', esc(e.message), 'err'); }
      wait(false);
      busy(go, false);
    };
  }

  if (step === 'check') {
    var run = async function () {
      busy(go, true, 'Vérification…');
      try {
        var r = await api('api/check');
        document.getElementById('checks').innerHTML = (r.checks || []).map(function (c) {
          return '<li><span class="ic">' + (c.ok ? '✅' : '⚠️') + '</span><div><b>' + esc(c.label) + '</b>' +
            (c.detail ? '<div class="d">' + esc(c.detail) + '</div>' : '') + '</div></li>';
        }).join('');
        say('m', othersHtml(r.others), '');
        bindOthers();
      } catch (e) { say('m', esc(e.message), 'err'); }
      busy(go, false);
    };
    go.onclick = run;
    bindLog();
    // Voies perdues : Jellyfin ne relâche un flux que sur fermeture explicite du lecteur. Après
    // quelques coupures, il refuse toutes les chaînes. Redéclarer le tuner remet son compte à zéro.
    var unl = document.getElementById('unlock');
    unl.dataset.label = unl.textContent;
    unl.onclick = async function () {
      busy(unl, true, 'Déblocage…');
      try {
        var u = await api('api/jellyfin/unlock', {});
        say('m', u.renewed
          ? 'Tuner redéclaré : les voies restées ouvertes après une coupure sont libérées. Relancez une chaîne.'
          : "Aucun tuner à redéclarer : vérifiez d'abord que Jellyfin est relié (écran ④).",
          u.renewed ? 'ok' : 'err');
      } catch (e) { say('m', esc(e.message), 'err'); }
      busy(unl, false);
    };

    var rep2 = document.getElementById('repair');
    rep2.dataset.label = rep2.textContent;
    rep2.onclick = async function () {
      if (!confirm("Remettre la TV en direct de Jellyfin d'aplomb ?\n\n" +
        "Jellyfin garde en base les chaînes qu'il a vues une fois, même retirées depuis. Son tuner va être " +
        "retiré le temps qu'il vide sa liste, puis redéclaré avec le guide. Comptez deux à trois minutes, " +
        "pendant lesquelles la TV en direct est indisponible. Vos enregistrements et vos réglages ne bougent pas.")) return;
      busy(rep2, true, 'Remise à plat…');
      wait(true, 'Remise à plat de Jellyfin…', 'Jellyfin vide sa liste de chaînes, puis la reconstruit depuis le moteur.');
      suivre(true);
      try {
        var r = await api('api/jellyfin/repair', {});
        wait(false);
        say('m', r.emptied
          ? 'Jellyfin est reparti d\'une liste vide et reconstruit la sienne depuis le moteur. Relancez la vérification dans quelques minutes.'
          : 'Jellyfin n\'a pas vidé sa liste (' + r.remaining + ' chaîne(s) restantes) ; le tuner a été redéclaré quand même.',
          r.emptied ? 'ok' : 'err');
      } catch (e) { wait(false); say('m', esc(e.message), 'err'); }
      busy(rep2, false);
    };
    run();
  }

  if (step === 'engine') bindLog();
}

/** Le journal du moteur, lisible depuis la vérification comme depuis les réglages avancés. */
function bindLog() {
  var logBtn = document.getElementById('log');
  if (!logBtn) return;
  logBtn.dataset.label = logBtn.textContent;
  logBtn.onclick = async function () {
    var box = document.getElementById('logbox');
    busy(logBtn, true, 'Lecture…');
    try {
      var r = await api('api/log');
      box.textContent = (r.log || []).join('\n') || 'Journal vide.';
      box.hidden = false;
    } catch (e) { say('m', esc(e.message), 'err'); }
    busy(logBtn, false);
  };
}

function show(id) {
  step = id;
  var def = STEPS[id] || STEPS['1'];
  document.getElementById('title').textContent = def.title;
  document.getElementById('sub').textContent = def.sub;
  document.getElementById('body').innerHTML = def.html();
  Array.prototype.slice.call(document.querySelectorAll('#nav .dk-nav')).forEach(function (b) {
    b.classList.toggle('active', b.dataset.step === id);
  });
  if (id === '1') {
    var u = document.getElementById('url');
    if (u && !u.value && S.subscriptionUrl && S.subscriptionUrl.indexOf('••••') < 0) u.value = S.subscriptionUrl;
  }
  wire();
}

async function load() {
  try {
    S = await api('api/state');
    groups = (S.groups && S.groups.length) ? S.groups : groups;
    var e = document.getElementById('engineState');
    e.textContent = S.engine.ok
      ? 'Moteur ' + (S.engine.version || 'prêt') + ' · ' + S.channels + ' chaîne(s)'
      : 'Moteur en cours de démarrage…';
  } catch (err) {
    document.getElementById('engineState').textContent = 'Moteur injoignable';
  }
}

document.getElementById('nav').addEventListener('click', function (ev) {
  var b = ev.target.closest('.dk-nav');
  if (b) show(b.dataset.step);
});
document.getElementById('refresh').onclick = async function () { await load(); show(step); };

(async function () {
  await load();
  // Reprise : on ouvre l'écran là où l'installation s'est arrêtée.
  var start = !S.playlist ? '1' : (!S.channels ? '2' : (!S.withGuide ? '3' : (!S.jellyfin.linked ? '4' : 'check')));
  if (window.desktroo) desktroo.setTitle('Desktroo TV');
  show(start);
})();
</script>
